<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="公募ナビAIは現在サービスを停止しています。">
  <title>公募ナビAI | サービス停止のお知らせ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shutdown.css?v=20260816">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://bantex.jp/" aria-label="BANTEX公式サイトへ">
      <span class="brand__mark" aria-hidden="true">B</span>
      <span class="brand__name">BANTEX</span>
    </a>
  </header>

  <main class="shutdown">
    <section class="shutdown__card" aria-labelledby="shutdown-title">
      <p class="shutdown__status"><span aria-hidden="true"></span>サービス停止中</p>
      <p class="shutdown__service">公募ナビAI</p>
      <h1 id="shutdown-title">
        <span class="phrase">現在、</span><span class="phrase">サービスを</span><span class="phrase">停止しています。</span>
      </h1>
      <p class="shutdown__lead">
        <span class="phrase">2026年8月16日より、</span><span class="phrase">サービスを停止しています。</span>
      </p>
      <div class="shutdown__notice">
        <p><span class="phrase">現在、以下の機能は</span><span class="phrase">利用できません。</span></p>
        <ul>
          <li>新規登録・ログイン</li>
          <li>公募情報の収集・検索</li>
          <li>AIによるマッチング</li>
          <li>メール通知・新規決済</li>
        </ul>
      </div>
      <p class="shutdown__footnote">
        <span class="phrase">再開時は、</span><span class="phrase">このページでお知らせします。</span>
      </p>
      <a class="home-link" href="https://bantex.jp/">BANTEX公式サイトへ</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; BANTEX</p>
  </footer>
</body>
</html>
